name: Framework Release

on:
  workflow_run:
    workflows: [Framework Validation]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish validated release
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'igor-baiborodine/spec-first-ai-framework' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'igor-baiborodine/spec-first-ai-framework' &&
      github.event.workflow_run.head_repository.full_name == 'igor-baiborodine/spec-first-ai-framework'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: framework-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the validated revision with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'

      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'

      - name: Provision release dependencies and pinned GitHub CLI
        run: |
          make setup
          make markdown-setup
          make gh-setup
          make gh-check

      - name: Publish the validated main revision as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          .venv/bin/python -B tools/release_publish.py \
            --repo . \
            --head "$VALIDATED_SHA" \
            --event-file "$GITHUB_EVENT_PATH" \
            --gh .tools/gh/2.103.0/gh \
            --validation-result "$VALIDATION_RESULT"
